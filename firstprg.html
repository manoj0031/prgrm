<!DOCTYPE html>
<html>
<head>
    <title>My Colorful Website</title>

    <style>
        body {
            background-color: #87CEEB;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: darkgreen;
            font-size: 20px;
        }

        button {
            background-color: orange;
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: red;
        }
    </style>
</head>

<body>
    <h1>Welcome Manoj!</h1>

    <p>This is my colorful HTML page.</p>

    <button onclick="alert('Hello Manoj!')">
        Click Me
    </button>
</body>
</html>
